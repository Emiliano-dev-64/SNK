    <div class="wanted-header">
      <h1 class="wanted-header__title"><svg class="section-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>Carteles de Recompensa</h1>

    </div>

    <!-- Wanted Grid -->
    <div class="wanted-grid">
      <!-- Populated by JavaScript -->
    </div>

  <!-- Music Player -->
  <div class="music-player">
    <button class="music-player__toggle" aria-label="Reproductor de música"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
    <label for="musicPlayerSelect" class="visually-hidden">Seleccionar canción</label>
    <select id="musicPlayerSelect" class="music-player__select"></select>
    <div class="music-player__controls">
      <button class="music-player__btn music-player__btn--prev" aria-label="Anterior"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>

      <button class="music-player__btn music-player__btn--repeat" aria-label="Repetir"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
    </div>
    <audio class="music-player__audio" loop></audio>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/app.js"></script>
