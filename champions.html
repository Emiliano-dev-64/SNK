<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="css/base.css">

  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/champions.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/music-player.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/tv.css">
</head>
<body data-page="champions">
<script>if(!window.__isSPA)location.replace('index.html?_r='+encodeURIComponent(location.pathname.split('/').pop()+location.search))</script>

  <a href="#main-content" class="skip-link">Saltar al contenido</a>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="navbar__logo">
      <img src="img/logo OP dnd.png" alt="Shuen No Kokai Logo">
      <span class="navbar__logo-text">Shuen No Kokai</span>
    </a>

    <div class="navbar__menu">
      <a href="index.html" class="navbar__link">Inicio</a>
      <a href="champions.html" class="navbar__link active">Personajes</a>
      <a href="world-map.html" class="navbar__link">Mapa</a>
      <a href="wanted.html" class="navbar__link">Wanted</a>

    </div>

    <button class="navbar__hamburger" aria-label="Menú">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile Menu -->
  <div class="navbar__mobile-menu">
    <a href="index.html" class="navbar__mobile-link">Inicio</a>
    <a href="champions.html" class="navbar__mobile-link">Personajes</a>
    <div class="navbar__mobile-submenu">
      <button class="navbar__mobile-link navbar__mobile-submenu-toggle">Mapa ▾</button>
      <div class="navbar__mobile-submenu-items">
        <a href="world-map.html" class="navbar__mobile-submenu-link">Mapa General</a>
        <a href="region.html?id=cozia" class="navbar__mobile-submenu-link">Cozia</a>
        <a href="region.html?id=archipielago-cozia" class="navbar__mobile-submenu-link">Archipiélago Cozia</a>
        <a href="faction.html?id=filo-maldito" class="navbar__mobile-submenu-link">Filo Maldito</a>
      </div>
    </div>
    <a href="wanted.html" class="navbar__mobile-link">Wanted</a>

  </div>

  <!-- Page Content -->
  <main id="main-content" class="champions-page">
    <!-- Header -->
    <div class="champions-header">
      <h1 class="champions-header__title"><svg class="section-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Personajes</h1>
      <p class="champions-header__subtitle">Los héroes que surcan los mares del Grand Line</p>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="filter-bar__search">
        <span class="filter-bar__search-icon">🔍</span>
        <label for="championSearch" class="visually-hidden">Buscar personaje</label>
        <input type="text" id="championSearch" placeholder="Buscar personaje...">
      </div>
      <div class="filter-bar__tags">
        <button class="filter-tag active" data-filter="all">Todos</button>
        <button class="filter-tag" data-filter="filo-maldito">Filo maldito</button>
        <button class="filter-tag" data-filter="archipielago-cozia">Archipiélago Cozia</button>
        <button class="filter-tag" data-filter="cozia">Cozia</button>
        <button class="filter-tag" data-filter="marina">Marina</button>
        <button class="filter-tag" data-filter="los-pierna-podrida">Los Pierna Podrida</button>
        <button class="filter-tag" data-filter="los-sin-nombre">Los Sin Nombre</button>
      </div>
    </div>

    <!-- Champions Grid -->
    <div class="champions-grid">
      <!-- Populated by JavaScript -->
    </div>
  </main>

  <!-- Music Player -->
  <div class="music-player">
    <div class="music-player__panel">
      <div class="music-player__panel-header">
        <h3 class="music-player__panel-title">Biblioteca Musical</h3>
        <button class="music-player__close" aria-label="Cerrar panel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
      </div>
      <div class="music-player__search">
        <svg class="music-player__search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Buscar canción...">
      </div>
      <div class="music-player__filters">
        <button class="music-player__filter active" data-filter="all">Todos</button>
        <button class="music-player__filter" data-filter="ambiental">Ambiental</button>
        <button class="music-player__filter" data-filter="pelea">Pelea</button>
        <button class="music-player__filter" data-filter="tension">Tensión</button>
        <button class="music-player__filter" data-filter="triste">Triste</button>
        <button class="music-player__filter" data-filter="epica">Épica</button>
        <button class="music-player__filter" data-filter="personaje">Personajes</button>
      </div>
      <div class="music-player__tracklist"></div>
    </div>
    <div class="music-player__bar">
      <div class="music-player__now">
        <span class="music-player__now-label">Reproduciendo</span>
          <span class="music-player__now-name">-</span>
        </div>
        <div class="music-player__controls">
        <button class="music-player__btn music-player__btn--prev" aria-label="Anterior"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
        <button class="music-player__btn music-player__btn--play" aria-label="Reproducir"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
        <button class="music-player__btn music-player__btn--next" aria-label="Siguiente"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
        <button class="music-player__btn music-player__btn--repeat" aria-label="Repetir"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
      </div>
      <button class="music-player__expand" aria-label="Abrir biblioteca"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg></button>
    </div>
    <div class="music-player__volume-row">
      <div class="music-player__duration">
        <span class="music-player__time music-player__time-current">0:00</span>
        <div class="music-player__progress"><div class="music-player__progress-fill"></div></div>
        <span class="music-player__time music-player__time-total">0:00</span>
      </div>
      <div class="music-player__volume">
        <button class="music-player__btn music-player__btn--volume" aria-label="Silenciar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>
        <input type="range" class="music-player__volume-slider" min="0" max="1" step="0.01" value="1">
      </div>
    </div>
    <audio class="music-player__audio" loop></audio>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
