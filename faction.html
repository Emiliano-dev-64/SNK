<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facción - Shuen No Kokai</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/logo OP dnd.png">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/region.css">
  <link rel="stylesheet" href="css/champion-detail.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/tooltip.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/music-player.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="faction">

  <a href="#main-content" class="skip-link">Saltar al contenido</a>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="navbar__logo">
      <img src="img/logo OP dnd.png" alt="Shuen No Kokai Logo">
      <span class="navbar__logo-text">Shuen No Kokai</span>
    </a>

    <div class="navbar__menu">
      <a href="index.html" class="navbar__link">Inicio</a>
      <a href="champions.html" class="navbar__link">Personajes</a>
      <a href="world-map.html" class="navbar__link">Mapa</a>
      <a href="wanted.html" class="navbar__link">Wanted</a>
      <a href="tiendas.html" class="navbar__link">Tienda</a>
      <a href="galeria.html" class="navbar__link">Galería</a>
    </div>

    <button class="navbar__hamburger" aria-label="Menú">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile Menu -->
  <div class="navbar__mobile-menu">
    <a href="index.html" class="navbar__mobile-link">Inicio</a>
    <a href="champions.html" class="navbar__mobile-link">Personajes</a>
    <div class="navbar__mobile-submenu">
      <button class="navbar__mobile-link navbar__mobile-submenu-toggle">Mapa ▾</button>
      <div class="navbar__mobile-submenu-items">
        <a href="world-map.html" class="navbar__mobile-submenu-link">Mapa General</a>
        <a href="region.html?id=cozia" class="navbar__mobile-submenu-link">Cozia</a>
        <a href="region.html?id=archipielago-cozia" class="navbar__mobile-submenu-link">Archipiélago Cozia</a>
      </div>
    </div>
    <a href="wanted.html" class="navbar__mobile-link">Wanted</a>
    <a href="tiendas.html" class="navbar__mobile-link">Tiendas</a>
    <a href="galeria.html" class="navbar__mobile-link">Galería</a>
  </div>

  <!-- Faction Page -->
  <main id="main-content" class="region-page">
    <!-- Hero -->
    <section class="region-hero">
      <img src="" alt="" class="region-hero__bg">
      <div class="region-hero__overlay"></div>
      <a href="champions.html" class="btn btn-secondary region-hero__back">← Volver a Personajes</a>
      <div class="region-hero__content">
        <h1 class="region-hero__name"></h1>
        <p class="region-hero__tagline"></p>
      </div>
    </section>

    <!-- Content -->
    <div class="region-content">
      <!-- Lore -->
      <section class="region-lore fade-in-up">
        <h2 class="region-lore__title section-title">Historia</h2>
        <p class="region-lore__text"></p>
      </section>

      <!-- Champions -->
      <section class="region-champions fade-in-up">
        <h2 class="region-champions__title section-title">Personajes</h2>
        <div class="region-champions__grid"></div>
      </section>

      <!-- Gallery -->
      <section class="region-gallery fade-in-up">
        <h2 class="region-gallery__title section-title">Galería</h2>
        <div class="region-gallery__grid"></div>
      </section>
    </div>
  </main>

  <!-- Music Player -->
  <div class="music-player">
    <button class="music-player__toggle" aria-label="Reproductor de música">🎵</button>
    <label for="musicPlayerSelect" class="visually-hidden">Seleccionar canción</label>
    <select id="musicPlayerSelect" class="music-player__select"></select>
    <div class="music-player__controls">
      <button class="music-player__btn music-player__btn--prev" aria-label="Anterior">⏮</button>
      <button class="music-player__btn music-player__btn--play" aria-label="Reproducir">▶</button>
      <button class="music-player__btn music-player__btn--next" aria-label="Siguiente">⏭</button>
      <button class="music-player__btn music-player__btn--repeat" aria-label="Repetir">🔁</button>
    </div>
    <audio class="music-player__audio" loop></audio>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
