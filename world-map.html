<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa del Mundo - One Pipis</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/logo OP dnd.png">
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/world-map.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/shops.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="world-map" style="overflow: hidden;">

  <!-- Navbar (Minimal for map) -->
  <nav class="navbar" style="background: rgba(10, 20, 40, 0.8); backdrop-filter: blur(10px);">
    <a href="index.html" class="navbar__logo">
      <img src="img/logo OP dnd.png" alt="One Pipis Logo" style="height: 32px;">
      <span class="navbar__logo-text" style="font-size: 1rem;">One Pipis</span>
    </a>

    <div class="navbar__menu">
      <a href="index.html" class="navbar__link">Inicio</a>
      <a href="champions.html" class="navbar__link">Personajes</a>
      <a href="world-map.html" class="navbar__link active">Mapa</a>
      <a href="wanted.html" class="navbar__link">Wanted</a>
      <a href="tiendas.html" class="navbar__link">Tienda</a>
    </div>

    <button class="navbar__hamburger" aria-label="Menú">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile Menu -->
  <div class="navbar__mobile-menu">
    <a href="index.html" class="navbar__mobile-link">Inicio</a>
    <a href="champions.html" class="navbar__mobile-link">Personajes</a>
    <div class="navbar__mobile-submenu">
      <button class="navbar__mobile-link navbar__mobile-submenu-toggle">Mapa ▾</button>
      <div class="navbar__mobile-submenu-items">
        <a href="world-map.html" class="navbar__mobile-submenu-link">Mapa General</a>
        <a href="region.html?id=cozia" class="navbar__mobile-submenu-link">Cozia</a>
        <a href="region.html?id=archipielago-cozia" class="navbar__mobile-submenu-link">Archipiélago Cozia</a>
        <a href="region.html?id=filo-maldito" class="navbar__mobile-submenu-link">Filo Maldito</a>
      </div>
    </div>
    <a href="wanted.html" class="navbar__mobile-link">Wanted</a>
    <a href="tiendas.html" class="navbar__mobile-link">Tiendas</a>
  </div>

  <!-- World Map -->
  <div class="world-map">
    <div id="mapaContainer" class="world-map__container">
      <div id="mapaZoom" class="world-map__zoom">
        <img src="img/mapamundibg.jpg" id="mapaBase" class="world-map__image" alt="Mapa del Mundo">
        
        <!-- Hotspots -->
        <div class="hotspot" style="top: 13.5%; left: 59.5%;" data-name="Cozia" data-region="cozia">
          <div class="hotspot__marker">
            <div class="hotspot__dot"></div>
            <div class="hotspot__ring"></div>
          </div>
        </div>
        
        <div class="hotspot" style="top: 14%; left: 54.8%;" data-name="Archipiélago Cozia" data-region="archipielago-cozia">
          <div class="hotspot__marker">
            <div class="hotspot__dot"></div>
            <div class="hotspot__ring"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Region Tooltip -->
    <div class="region-tooltip"></div>

    <!-- Map Controls -->
    <div class="map-controls">
      <button class="map-controls__btn" id="zoomIn" aria-label="Acercar">+</button>
      <div class="map-controls__zoom-level" id="zoomLevel">100%</div>
      <button class="map-controls__btn" id="zoomOut" aria-label="Alejar">−</button>
      <button class="map-controls__btn" id="zoomReset" aria-label="Restablecer zoom">⟲</button>
    </div>

    <!-- Region Panel (Slide-in) -->
    <div class="region-panel">
      <button class="region-panel__close" aria-label="Cerrar panel">&times;</button>
      <div class="region-panel__hero">
        <img src="" alt="" class="region-panel__hero-img">
        <div class="region-panel__hero-overlay"></div>
        <h2 class="region-panel__hero-name"></h2>
      </div>
      <div class="region-panel__content">
        <p class="region-panel__description"></p>
        
        <h3 class="region-panel__section-title">Personajes</h3>
        <div class="region-panel__champions"></div>
        
        <button class="btn btn-primary region-panel__explore-btn">Explorar Región</button>
      </div>
    </div>

    <!-- Region Panel Backdrop -->
    <div class="region-panel-backdrop" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 899; opacity: 0; visibility: hidden; transition: all 0.3s;"></div>

    <!-- Mini Map -->
    <div class="mini-map">
      <img src="img/mapamundibg.jpg" alt="Mini Mapa" class="mini-map__image">
      <div class="mini-map__viewport"></div>
    </div>
  </div>

  <!-- Music Player -->
  <div class="music-player">
    <button class="music-player__toggle" aria-label="Toggle music player">🎵</button>
    <select class="music-player__select" title="Seleccionar canción"></select>
    <div class="music-player__controls">
      <button class="music-player__btn music-player__btn--prev" aria-label="Anterior">⏮</button>
      <button class="music-player__btn music-player__btn--play" aria-label="Reproducir">▶</button>
      <button class="music-player__btn music-player__btn--next" aria-label="Siguiente">⏭</button>
      <button class="music-player__btn music-player__btn--repeat" aria-label="Repetir">🔁</button>
    </div>
    <audio class="music-player__audio" loop></audio>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
